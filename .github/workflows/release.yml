name: Prepare & Deploy a Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        name: New Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Node Environment
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Install Composer Dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction

            - name: NPM Install
              run: npm ci

            - name: Build Release into dist/
              run: npm run release

            - name: Create ZIP
              run: |
                  PLUGIN_SLUG="daggerhart-openid-connect-generic"
                  rm -rf /tmp/build-zip
                  mkdir -p /tmp/build-zip/$PLUGIN_SLUG
                  cp -r dist/. /tmp/build-zip/$PLUGIN_SLUG/
                  rm -rf /tmp/build-zip/$PLUGIN_SLUG/dist
                  if [ ! -d "/tmp/build-zip/$PLUGIN_SLUG/vendor" ]; then
                    cp -r vendor /tmp/build-zip/$PLUGIN_SLUG/
                  fi
                  cd /tmp/build-zip && zip -r $GITHUB_WORKSPACE/$PLUGIN_SLUG.zip $PLUGIN_SLUG

            - name: Upload ZIP
              uses: softprops/action-gh-release@v2
              with:
                  files: daggerhart-openid-connect-generic.zip
