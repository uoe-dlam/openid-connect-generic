name: Prepare & Deploy a Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        name: New Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Node Environment
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: NPM Install
              run: npm ci

            - name: Build Release into dist/
              run: npm run build-dist

            - name: Create ZIP
              run: |
                  PLUGIN_SLUG="daggerhart-openid-connect-generic"
                  rm -rf /tmp/package
                  mkdir -p /tmp/package/$PLUGIN_SLUG
                  cp -r dist/. /tmp/package/$PLUGIN_SLUG/
                  cd /tmp/package && zip -r $GITHUB_WORKSPACE/$PLUGIN_SLUG.zip $PLUGIN_SLUG

            - name: Upload ZIP
              uses: softprops/action-gh-release@v2
              with:
                  files: daggerhart-openid-connect-generic.zip
